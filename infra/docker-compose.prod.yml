services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: private_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/private-assistant/data/postgres:/var/lib/postgresql/data
    networks:
      - internal

  api:
    image: private-assistant-api:latest
    restart: unless-stopped
    env_file:
      - /srv/private-assistant/deploy/api.env
    depends_on:
      - postgres
    networks:
      - internal
      - edge

  web:
    image: private-assistant-web:latest
    restart: unless-stopped
    env_file:
      - /srv/private-assistant/deploy/web.env
    depends_on:
      - api
    networks:
      - edge

networks:
  edge:
  internal:
